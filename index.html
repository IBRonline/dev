  const box = JSON.parse(document.getElementById('box').textContent), f = document.getElementById('f'), c = document.getElementById('c'), e = document.getElementById('e');
  const ub = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  async function open(code, remember) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(box.s), iterations: box.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    let pt; try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(box.i) }, key, ub(box.c)); } catch (x) { throw new Error('Wrong access code'); }
    const html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    try { sessionStorage.setItem('ibr-devcode', code); if (remember) localStorage.setItem('ibr-devcode', code); } catch (x) {}
    document.open(); document.write(html); document.close();
  }
  f.addEventListener('submit', async ev => { ev.preventDefault(); e.textContent = 'Unlocking…'; try { await open(c.value, document.getElementById('r').checked); } catch (x) { e.textContent = x.message; c.select(); } });
  let saved = ''; try { saved = sessionStorage.getItem('ibr-devcode') || localStorage.getItem('ibr-devcode') || ''; } catch (x) {}
  if (saved) { e.textContent = 'Unlocking…'; open(saved).catch(() => { try { sessionStorage.removeItem('ibr-devcode'); localStorage.removeItem('ibr-devcode'); } catch (x) {} e.textContent = ''; }); }
